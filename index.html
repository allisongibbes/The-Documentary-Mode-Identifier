<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Documentary Approach Identifier</title>
    <style>
        body {
            background-color: #22272e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #f1e800;
            margin-bottom: 5px;
            text-align: center;
        }
        p.instructions {
            color: #adbac7;
            margin-bottom: 20px;
            text-align: center;
            max-width: 650px;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            background-color: #2d333b;
            border: 2px solid #444c56;
            border-radius: 8px;
            padding: 20px;
            gap: 20px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            background-color: #1c2128;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #f1e800;
        }
        .challenge-box {
            background-color: #1c2128;
            border: 2px solid #f1e800;
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .scenario-tag {
            display: inline-block;
            background-color: #f1e800;
            color: #22272e;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            align-self: flex-start;
        }
        .scenario-text {
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            color: #ffffff;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background-color: #444c56;
            color: #ffffff;
            border: 2px solid transparent;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #373e47;
            border-color: #f1e800;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }
        .feedback-area {
            background-color: #373e47;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #f1e800;
            display: none;
        }
        .feedback-area h4 {
            margin: 0 0 5px 0;
            color: #f1e800;
        }
        .feedback-area p {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
        }
        .next-btn {
            background-color: #f1e800;
            color: #22272e;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            align-self: center;
            display: none;
        }
        .next-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h2>The Documentary Approach Identifier</h2>
    <p class="instructions">Put your analytical skills to the test! Read each film scenario and correctly identify whether it represents a Factual, Instructional, Persuasive, or Propaganda approach.</p>

    <div class="container">
        <!-- Score & Progress -->
        <div class="score-board">
            <span id="progress-indicator">Scenario 1 of 4</span>
            <span id="score-indicator">Score: 0 / 0</span>
        </div>

        <!-- Challenge Screen -->
        <div class="challenge-box">
            <span id="scenario-badge" class="scenario-tag">Scenario 1</span>
            <p id="scenario-desc" class="scenario-text">Loading scenario...</p>
        </div>

        <!-- Options Grid -->
        <div id="options-container" class="options-grid">
            <!-- Dynamically injected option buttons -->
        </div>

        <!-- Feedback & Explanation -->
        <div id="feedback-box" class="feedback-area">
            <h4 id="feedback-title">Result</h4>
            <p id="feedback-desc"></p>
        </div>

        <button id="next-btn" class="next-btn" onclick="nextChallenge()">Next Scenario</button>
    </div>

    <script>
        const challenges = [
            {
                badge: "Scenario 1",
                text: "An archival compilation of raw footage capturing hourly weather patterns across Antarctica without commentary or persuasion.",
                correct: "Factual",
                explanation: "This is a Factual film, presenting straightforward, unembellished information and data about the world like a historical archive[cite: 9].",
                options: ["Factual", "Instructional", "Persuasive", "Propaganda"]
            },
            {
                badge: "Scenario 2",
                text: "A step-by-step video demonstration detailing proper techniques for changing an automobile tire and maintaining vehicle safety.",
                correct: "Instructional",
                explanation: "This is an Instructional film, designed to educate viewers on how to perform specific practical tasks and master procedural skills[cite: 9].",
                options: ["Factual", "Instructional", "Persuasive", "Propaganda"]
            },
            {
                badge: "Scenario 3",
                text: "An investigative feature exposing corporate pollution in local watersheds using expert interviews, charts, and emotional musical scoring to advocate for policy reform.",
                correct: "Persuasive",
                explanation: "This is a Persuasive documentary, actively advocating a specific social or political viewpoint and marshaling evidence to inspire change[cite: 9].",
                options: ["Factual", "Instructional", "Persuasive", "Propaganda"]
            },
            {
                badge: "Scenario 4",
                text: "A state-sponsored film glorifying supreme leadership through heavily distorted statistics, emotional marching music, and censored framing disguised as absolute truth.",
                correct: "Propaganda",
                explanation: "This is a Propaganda film, systematically produced by authorities to mold public opinion and manufacture compliance through deceptive messaging[cite: 9].",
                options: ["Factual", "Instructional", "Persuasive", "Propaganda"]
            }
        ];

        let currentChallenge = 0;
        let score = 0;
        let answered = false;

        function loadChallenge() {
            answered = false;
            const c = challenges[currentChallenge];
            
            document.getElementById('progress-indicator').innerText = `Scenario ${currentChallenge + 1} of ${challenges.length}`;
            document.getElementById('score-indicator').innerText = `Score: ${score} / ${currentChallenge}`;
            document.getElementById('scenario-badge').innerText = c.badge;
            document.getElementById('scenario-desc').innerText = c.text;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            // Shuffle options for interactivity
            const shuffledOptions = [...c.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, c.correct, c.explanation);
                container.appendChild(btn);
            });

            document.getElementById('feedback-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selected, correct, explanation) {
            if (answered) return;
            answered = true;

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correct) {
                    btn.style.backgroundColor = '#2ecc71';
                    btn.style.color = '#22272e';
                } else if (btn.innerText === selected && selected !== correct) {
                    btn.style.backgroundColor = '#e74c3c';
                    btn.style.color = '#ffffff';
                }
            });

            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.style.display = 'block';

            if (selected === correct) {
                score++;
                document.getElementById('feedback-title').innerText = 'Correct! Excellent Analysis.';
                document.getElementById('feedback-title').style.color = '#2ecc71';
                feedbackBox.style.borderLeftColor = '#2ecc71';
            } else {
                document.getElementById('feedback-title').innerText = 'Incorrect.';
                document.getElementById('feedback-title').style.color = '#e74c3c';
                feedbackBox.style.borderLeftColor = '#e74c3c';
            }

            document.getElementById('feedback-desc').innerText = explanation;
            document.getElementById('score-indicator').innerText = `Score: ${score} / ${currentChallenge + 1}`;

            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'block';
            if (currentChallenge === challenges.length - 1) {
                nextBtn.innerText = 'Restart Identifier';
            } else {
                nextBtn.innerText = 'Next Scenario';
            }
        }

        function nextChallenge() {
            currentChallenge++;
            if (currentChallenge >= challenges.length) {
                currentChallenge = 0;
                score = 0;
            }
            loadChallenge();
        }

        window.onload = loadChallenge;
    </script>
</body>
</html>
